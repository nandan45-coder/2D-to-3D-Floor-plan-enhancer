# Web server of the website container (Prompt 39): serves the built React app and forwards /api/* to the backend.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # uploads: plans up to 15 MB (backend limit) + form overhead
    client_max_body_size 20m;

    # security headers for every page and file of the website
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # the backend; looked up through Docker's DNS on every request, so a restarted backend is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the backend sends its own copies of these; keep one of each (the ones above)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # a stopped backend: answer "unavailable" within seconds (the website then shows "Can't reach the server")
        proxy_connect_timeout 5s;
        # floor plan detection runs inside the upload request and can take a while on large plans
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # built files have content hashes in their names: cache them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # every other path is a page of the single-page app
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
