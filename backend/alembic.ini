# Alembic configuration (UI-2). The database URL comes from the app settings (DATABASE_URL / .env), not from here.
# Migration scripts are in backend/migrations (not named "alembic", so they can never hide the alembic package).
# Migrations run automatically when the backend starts (app.core.database.init_db); by hand:
#   alembic upgrade head        (from the backend folder)
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
